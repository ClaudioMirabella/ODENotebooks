# Builds the student site from the notebooks and publishes it with GitHub Pages.
# Once, in the repository settings: Pages > Build and deployment > Source: GitHub Actions.
name: Build and publish the student site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep the downloaded Python runtime between builds
        uses: actions/cache@v4
        with:
          path: site/.cache
          key: site-cache-${{ hashFiles('site/build_site.py', 'site/requirements-site.txt') }}
      - name: Install the build tools
        run: python -m pip install -r site/requirements-site.txt
      - name: Test the library, then build the site
        run: python site/build_site.py
      - name: Test the home page and the corrections
        run: python -m pytest -q site/test_build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
